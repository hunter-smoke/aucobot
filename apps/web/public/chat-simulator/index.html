<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mô phỏng chat Aucobot</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="simulator-root" data-testid="demo-frame">
      <div class="chat-scroll" id="chat-container">
        <div class="msg-row msg-row--user">
          <div class="bubble bubble--user">
            <p>Có, và thêm hashtag nhé.</p>
          </div>
        </div>

        <div class="msg-row">
          <div class="avatar avatar--sm">CO</div>
          <div class="bubble bubble--agent">
            <p class="agent-label">Content</p>
            <p class="agent-body">Đã thêm 2 caption + hashtag:</p>
            <div class="agent-caption-list">
              <p class="caption-item">
                4. Xuân về, rộn ràng tiếng cười
                <span class="hashtag">#Tet2026</span>
              </p>
              <p class="caption-item">
                5. Trao lộc đầu năm, đón vạn điều may
                <span class="hashtag">#TetSumVay</span>
              </p>
            </div>
            <p class="agent-footnote">
              Xem hướng dẫn đăng lịch ở
              <a href="#">đây</a>.
            </p>
            <span class="msg-time">13:49</span>
          </div>
        </div>

        <div id="dynamic-messages-area"></div>
        <div id="chat-bottom"></div>
      </div>

      <div class="input-area" id="input-area-container">
        <button type="button" class="icon-btn icon-btn--rotate" aria-hidden="true">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"
            />
          </svg>
        </button>
        <button type="button" class="icon-btn" aria-hidden="true">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
        </button>

        <div class="chat-input" id="chat-input" data-testid="chat-input">
          <span class="input-placeholder" id="input-placeholder">Nhắn tin</span>
        </div>

        <button type="button" class="icon-btn" aria-hidden="true">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </button>
        <button type="button" class="send-btn" aria-hidden="true">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
            />
          </svg>
        </button>
      </div>
    </div>

    <button type="button" id="replay-btn" data-testid="replay-btn">
      Chạy lại mô phỏng ↺
    </button>

    <div id="fake-cursor" data-testid="fake-cursor"></div>

    <script src="simulator.js"></script>
  </body>
</html>
