services:
  postgres:
    image: postgres:16-alpine
    container_name: aucobot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aucobot
      POSTGRES_PASSWORD: aucobot
      POSTGRES_DB: aucobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aucobot -d aucobot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
