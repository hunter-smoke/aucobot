<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình giả lập Chat Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="relative w-full max-w-[650px] h-[92vh] bg-transparent flex flex-col rounded-3xl overflow-hidden px-4 py-2">
        


        <!-- Chat Area -->
        <div class="flex-1 overflow-y-auto pb-4 pt-1 px-1 chat-scroll flex flex-col gap-4 relative" id="chat-container">
            
            <!-- Dummy Message User -->
            <div class="flex justify-end mb-1">
                <div class="bg-sky-400 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[80%] shadow-sm text-sm">
                    <p>Có, và thêm hashtag nhé.</p>
                </div>
            </div>

            <!-- Dummy Message System/Content -->
            <div class="flex gap-3 mb-1">
                <div class="w-8 h-8 rounded-full bg-teal-500 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-sm">CO</div>
                <div class="bg-white text-gray-800 p-4 rounded-2xl rounded-tl-sm max-w-[85%] shadow-sm border border-white relative">
                    <p class="text-sky-500 font-bold mb-1.5 text-xs tracking-wide">Content</p>
                    <p class="mb-3 text-sm font-medium text-gray-700">Đã thêm 2 caption + hashtag:</p>
                    <div class="space-y-2 mb-3">
                        <p class="bg-gray-50/80 p-2.5 rounded-xl text-xs text-gray-700 leading-relaxed border border-gray-100">4. Xuân về, rộn ràng tiếng cười <span class="bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded text-[10px] font-semibold">#Tet2026</span></p>
                        <p class="bg-gray-50/80 p-2.5 rounded-xl text-xs text-gray-700 leading-relaxed border border-gray-100">5. Trao lộc đầu năm, đón vạn điều may <span class="bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded text-[10px] font-semibold">#TetSumVay</span></p>
                    </div>
                    <p class="text-xs text-gray-500">Xem hướng dẫn đăng lịch ở <a href="#" class="text-sky-500 underline font-medium">đây</a>.</p>
                    <span class="text-[10px] text-gray-400 absolute bottom-2 right-3">13:49</span>
                </div>
            </div>

            <!-- Vùng chứa các tin nhắn động sẽ được append bằng JS -->
            <div id="dynamic-messages-area" class="flex flex-col gap-4"></div>

            <!-- Div trống để scroll tới cuối -->
            <div id="chat-bottom"></div>
        </div>

        <!-- Input Area -->
        <div class="bg-white p-2.5 rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.06)] flex items-center gap-1 z-10 border border-white" id="input-area-container">
            <button class="icon-btn">
                <svg class="w-5 h-5 transform rotate-45" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
            </button>
            <button class="icon-btn">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </button>
            
            <div class="flex-1 bg-transparent px-3 py-1 outline-none text-sm text-gray-700 min-h-[24px] flex items-center" id="chat-input">
                <span class="text-gray-400" id="input-placeholder">Nhắn tin</span>
            </div>

            <button class="icon-btn">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
            <button class="w-9 h-9 rounded-full bg-sky-400 flex items-center justify-center text-white hover:bg-sky-500 transition-colors shadow-sm shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Nút điều khiển Chạy lại kịch bản -->
    <button id="replay-btn" class="hidden absolute bottom-4 right-4 bg-gray-900/80 hover:bg-gray-900 text-white font-medium text-xs px-3 py-2 rounded-lg shadow-md backdrop-blur transition-all active:scale-95 z-50">
        Chạy lại mô phỏng ↺
    </button>

    <!-- Fake Cursor -->
    <div id="fake-cursor"></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
