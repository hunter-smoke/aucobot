name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXT_PUBLIC_API_URL: https://api.aucobot.com

jobs:
  ci:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace packages for ESLint
        run: pnpm --filter @aucobot/shared --filter @aucobot/database build

      - name: Lint API
        run: pnpm --filter @aucobot/api lint:ci

      - name: Test API
        run: pnpm --filter @aucobot/api test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
